<!DOCTYPE html>
<html lang="en">

<head>
  <title>Sign up</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="vh-100">



  <div class="d-flex justify-content-center align-items-center h-100 bg-secondary">
    <div class="w-50 border border-dark p-5 bg-body rounded-5">

      <form class="row g-3 needs-validation" novalidate>
        <h2>Sign up form</h2>
        <div class="col-12">
          <div class="form-check">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" placeholder="Enter name" name="name" required>
            <div class="invalid-feedback">
              Hãy nhập tên
            </div>
          </div>
        </div>

        <div class="col-12">
          <div class="form-check">
            <label for="phone" class="form-label">Phone</label>
            <input type="tel" class="form-control" id="phone" placeholder="Enter phone" name="phone" required minlength="10">
            <div class="invalid-feedback">
              Số điện thoại từ 10 số
            </div>
          </div>
        </div>

        <div class="col-12">
          <div class="form-check">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="Enter email" name="email" required>
            <div class="invalid-feedback">
              Hãy nhập đúng định dạng email
            </div>
          </div>
        </div>

        <div class="col-12">
          <div class="form-check">
            <label for="pwd" class="form-label">Password:</label>
            <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="pswd" required minlength="5">
            <div class="invalid-feedback">
              Mật khẩu từ 5 ký tự
            </div>
          </div>
        </div>
        <div class="col-12">
          <div class="form-check">
            <button type="submit" class="btn btn-dark" id="sign_up">Submit</button>
          </div>

        </div>
      </form>
    </div>

  </div>
  <script src="../js/sign_up.js"></script>
</body>

</html>
